<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56" role="img" aria-label="Proyectos">
  <rect x="1" y="1" width="998" height="54" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="54" rx="4" fill="#8B0000"/>
  <circle cx="940" cy="28" r="5" fill="#ff5f56"/>
  <circle cx="958" cy="28" r="5" fill="#ffbd2e"/>
  <circle cx="976" cy="28" r="5" fill="#27c93f"/>
  <g font-family="'Courier New', Consolas, monospace" font-size="22" xml:space="preserve">
    <text x="30" y="36" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> <tspan fill="#58a6ff">cd ./proyectos</tspan></text>
    <rect x="44" y="12" width="238" height="32" fill="#0d1117">
      <animate attributeName="x" from="44" to="282" dur="1.12s" fill="freeze"/>
      <animate attributeName="width" from="238" to="0" dur="1.12s" fill="freeze"/>
    </rect>
    <rect x="267" y="14" width="11" height="26" fill="#7ee787" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="1.12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
