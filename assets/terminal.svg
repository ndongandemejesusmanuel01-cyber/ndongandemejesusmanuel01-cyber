<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Terminal con una presentación de Jesús Manuel">
  <!-- Ventana del terminal -->
  <rect width="800" height="270" rx="14" fill="#0d1117" stroke="#8B0000" stroke-width="2"/>
  <path d="M0 14 A14 14 0 0 1 14 0 H786 A14 14 0 0 1 800 14 V38 H0 Z" fill="#1a1f27"/>
  <circle cx="28" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="19" r="6" fill="#27c93f"/>
  <text x="400" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">jesus@madrid: ~</text>

  <g font-family="'Courier New', Consolas, monospace" font-size="17" xml:space="preserve">
    <!-- Cada línea de texto lleva encima un rectángulo del color del fondo que se encoge:
         así parece que se escribe a máquina -->

    <text x="30" y="88" fill="#e6edf3"><tspan fill="#E74C3C">$</tspan> whoami</text>
    <rect x="30" y="68" width="120" height="26" fill="#0d1117">
      <animate attributeName="x" from="30" to="150" begin="0.5s" dur="0.6s" fill="freeze"/>
      <animate attributeName="width" from="120" to="0" begin="0.5s" dur="0.6s" fill="freeze"/>
    </rect>

    <text x="30" y="116" fill="#7ee787">Jesús Manuel · Estudiante de 2º de DAW · Madrid</text>
    <rect x="30" y="96" width="520" height="26" fill="#0d1117">
      <animate attributeName="x" from="30" to="550" begin="1.4s" dur="1.2s" fill="freeze"/>
      <animate attributeName="width" from="520" to="0" begin="1.4s" dur="1.2s" fill="freeze"/>
    </rect>

    <text x="30" y="152" fill="#e6edf3"><tspan fill="#E74C3C">$</tspan> cat stack.txt</text>
    <rect x="30" y="132" width="200" height="26" fill="#0d1117">
      <animate attributeName="x" from="30" to="230" begin="3s" dur="0.8s" fill="freeze"/>
      <animate attributeName="width" from="200" to="0" begin="3s" dur="0.8s" fill="freeze"/>
    </rect>

    <text x="30" y="180" fill="#7ee787">HTML · CSS · JavaScript · PHP · Java · MySQL</text>
    <rect x="30" y="160" width="500" height="26" fill="#0d1117">
      <animate attributeName="x" from="30" to="530" begin="4s" dur="1.2s" fill="freeze"/>
      <animate attributeName="width" from="500" to="0" begin="4s" dur="1.2s" fill="freeze"/>
    </rect>

    <text x="30" y="216" fill="#e6edf3"><tspan fill="#E74C3C">$</tspan> git status</text>
    <rect x="30" y="196" width="180" height="26" fill="#0d1117">
      <animate attributeName="x" from="30" to="210" begin="5.6s" dur="0.7s" fill="freeze"/>
      <animate attributeName="width" from="180" to="0" begin="5.6s" dur="0.7s" fill="freeze"/>
    </rect>

    <text x="30" y="244" fill="#7ee787">Practicando JDBC, CSS Grid y mucha constancia</text>
    <rect x="30" y="224" width="500" height="26" fill="#0d1117">
      <animate attributeName="x" from="30" to="530" begin="6.6s" dur="1.2s" fill="freeze"/>
      <animate attributeName="width" from="500" to="0" begin="6.6s" dur="1.2s" fill="freeze"/>
    </rect>

    <!-- Cursor que parpadea al final -->
    <rect x="500" y="230" width="10" height="18" fill="#E74C3C" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
