    <rect x="22" y="164" width="60" height="22" fill="#0d1117"><animate attributeName="x" from="22" to="82" begin="4.6s" dur="0.3s" fill="freeze"/><animate attributeName="width" from="60" to="0" begin="4.6s" dur="0.3s" fill="freeze"/></rect>

    <text x="22" y="214"><tspan fill="#dcdcaa">build</tspan><tspan fill="#d4d4d4">(); </tspan><tspan fill="#dcdcaa">ship</tspan><tspan fill="#d4d4d4">();</tspan></text>
