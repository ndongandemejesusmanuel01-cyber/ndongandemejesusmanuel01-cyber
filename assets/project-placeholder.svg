    <rect x="22" y="52" width="120" height="22" fill="#0d1117"><animate attributeName="x" from="22" to="142" begin="0.4s" dur="0.5s" fill="freeze"/><animate attributeName="width" from="120" to="0" begin="0.4s" dur="0.5s" fill="freeze"/></rect>

    <text x="22" y="96"><tspan fill="#569cd6">const</tspan> <tspan fill="#9cdcfe">proyecto</tspan> <tspan fill="#d4d4d4">= {</tspan></text>
    <rect x="22" y="80" width="330" height="22" fill="#0d1117"><animate attributeName="x" from="22" to="352" begin="1s" dur="0.9s" fill="freeze"/><animate attributeName="width" from="330" to="0" begin="1s" dur="0.9s" fill="freeze"/></rect>

    <text x="40" y="124"><tspan fill="#9cdcfe">estado</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">"en construcción"</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <rect x="40" y="108" width="330" height="22" fill="#0d1117"><animate attributeName="x" from="40" to="370" begin="2s" dur="1.2s" fill="freeze"/><animate attributeName="width" from="330" to="0" begin="2s" dur="1.2s" fill="freeze"/></rect>

    <text x="40" y="152"><tspan fill="#9cdcfe">lanzamiento</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">"muy pronto"</tspan></text>
    <rect x="40" y="136" width="330" height="22" fill="#0d1117"><animate attributeName="x" from="40" to="370" begin="3.4s" dur="1s" fill="freeze"/><animate attributeName="width" from="330" to="0" begin="3.4s" dur="1s" fill="freeze"/></rect>

